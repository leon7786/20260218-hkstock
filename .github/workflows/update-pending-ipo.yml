name: daily-sync

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 06:55 触发，作业内等待到 Asia/Hong_Kong 15:00 后再开始同步
    - cron: '55 6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node deps
        run: npm ci || npm install

      - name: Install Python deps
        run: pip install beautifulsoup4 requests

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait until HKT 15:00
        shell: bash
        run: |
          now_hm=$(TZ=Asia/Hong_Kong date +%H%M)
          target_hm=1500
          if [ "$now_hm" -lt "$target_hm" ]; then
            now_epoch=$(date +%s)
            target_epoch=$(TZ=Asia/Hong_Kong date -d "$(TZ=Asia/Hong_Kong date +%F) 15:00:00" +%s)
            sleep_sec=$((target_epoch - now_epoch))
            if [ "$sleep_sec" -gt 0 ]; then
              echo "Waiting ${sleep_sec}s until HKT 15:00"
              sleep "$sleep_sec"
            fi
          fi
          echo "Starting sync at $(TZ=Asia/Hong_Kong date '+%F %T %Z')"

      - name: Run Futunn-only sync pipeline
        run: python3 scripts/sync_futunn_to_pages.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ scripts/ .github/workflows/ package.json package-lock.json requirements-sync.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(sync): daily futunn + hkex update $(date -u +%Y-%m-%d)"
          git push
